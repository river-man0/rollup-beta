name: Deploy IronMan Tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ironman-progress-tracker-m9kezu
    paths:
      - "ironman-tracker/**"
      - ".github/workflows/deploy-ironman-tracker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tracker tests
        run: node ironman-tracker/tests/run-tests.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ironman-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
